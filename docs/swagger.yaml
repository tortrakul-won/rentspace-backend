basePath: /api/v1
definitions:
  handler.BookingResponse:
    properties:
      company_name:
        type: string
      created_at:
        type: string
      end_time:
        type: string
      id:
        type: string
      platform_fee:
        type: integer
      renter_id:
        type: string
      renter_type:
        type: string
      space_id:
        type: string
      start_time:
        type: string
      status:
        type: string
      tax_id:
        type: string
      total_price:
        type: integer
      updated_at:
        type: string
    type: object
  handler.CreateBookingRequest:
    properties:
      company_name:
        type: string
      end_time:
        type: string
      platform_fee:
        type: integer
      renter_id:
        type: string
      renter_type:
        type: string
      space_id:
        type: string
      start_time:
        type: string
      tax_id:
        type: string
      total_price:
        type: integer
    type: object
  handler.CreateSpaceRequest:
    properties:
      amenities:
        items:
          type: string
        type: array
      capacity:
        type: integer
      category:
        type: string
      daily_rate:
        type: integer
      description:
        type: string
      hourly_rate:
        type: integer
      images:
        items:
          type: string
        type: array
      location:
        type: string
      min_hours:
        type: integer
      name:
        type: string
      owner_id:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.SpaceResponse:
    properties:
      amenities:
        items:
          type: string
        type: array
      capacity:
        type: integer
      category:
        type: string
      created_at:
        type: string
      daily_rate:
        type: integer
      description:
        type: string
      hourly_rate:
        type: integer
      id:
        type: string
      images:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      location:
        type: string
      min_hours:
        type: integer
      name:
        type: string
      owner_id:
        type: string
      updated_at:
        type: string
    type: object
  handler.UpdateStatusRequest:
    properties:
      status:
        $ref: '#/definitions/store.BookingStatus'
    type: object
  store.BookingStatus:
    enum:
    - pending
    - confirmed
    - completed
    - cancelled
    type: string
    x-enum-varnames:
    - BookingStatusPending
    - BookingStatusConfirmed
    - BookingStatusCompleted
    - BookingStatusCancelled
host: localhost:8080
info:
  contact: {}
  description: Short-term space rental marketplace API for Thailand
  title: RentSpace API
  version: "1.0"
paths:
  /bookings:
    post:
      consumes:
      - application/json
      parameters:
      - description: Booking details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateBookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.BookingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Space not available
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Create a booking
      tags:
      - bookings
  /bookings/{id}:
    get:
      parameters:
      - description: Booking UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BookingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get a booking by ID
      tags:
      - bookings
  /bookings/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Booking UUID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BookingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Update booking status
      tags:
      - bookings
  /health:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /spaces:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.SpaceResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List all active spaces
      tags:
      - spaces
    post:
      consumes:
      - application/json
      parameters:
      - description: Space details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateSpaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.SpaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Create a new space listing
      tags:
      - spaces
  /spaces/{id}:
    delete:
      parameters:
      - description: Space UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SpaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Deactivate a space listing
      tags:
      - spaces
    get:
      parameters:
      - description: Space UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SpaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get a space by ID
      tags:
      - spaces
    put:
      consumes:
      - application/json
      parameters:
      - description: Space UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated space details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateSpaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SpaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Update a space listing
      tags:
      - spaces
  /spaces/{id}/bookings:
    get:
      parameters:
      - description: Space UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.BookingResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List bookings for a space
      tags:
      - bookings
swagger: "2.0"
