services:
  postgres:
    image: postgres:18
    container_name: rentspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8-chromium
    container_name: rentspace-gotenberg
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./fonts:/usr/local/share/fonts/custom:ro
    command:
      - gotenberg
      - --chromium-allow-list=file:///.*
      - --log-level=warn

volumes:
  postgres_data:
