<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @font-face {
    font-family: 'TH Sarabun New';
    src: url('/usr/local/share/fonts/custom/THSarabunNew.ttf') format('truetype');
    font-weight: normal;
  }
  @font-face {
    font-family: 'TH Sarabun New';
    src: url('/usr/local/share/fonts/custom/THSarabunNew Bold.ttf') format('truetype');
    font-weight: bold;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'TH Sarabun New', 'Sarabun', sans-serif;
    font-size: 15pt;
    line-height: 1.6;
    color: #1a1a1a;
    padding: 20mm 20mm 15mm 20mm;
  }
  .header { text-align: center; margin-bottom: 8mm; }
  .header .platform-name { font-size: 18pt; font-weight: bold; }
  .header .doc-title { font-size: 20pt; font-weight: bold; margin-top: 2mm; }
  .header .doc-subtitle { font-size: 13pt; color: #555; }
  .doc-number { text-align: right; font-size: 13pt; margin-bottom: 6mm; color: #333; }
  .section { margin-bottom: 4mm; }
  .section-title { font-weight: bold; font-size: 15pt; border-bottom: 1px solid #ccc; padding-bottom: 1mm; margin-bottom: 3mm; }
  table { width: 100%; border-collapse: collapse; }
  tr { page-break-inside: avoid; break-inside: avoid; }
  th, td { padding: 1mm 3mm; text-align: left; vertical-align: top; }
  .label { color: #555; width: 40%; }
  .amount-table th { background: #f5f5f5; font-weight: bold; border: 1px solid #ddd; }
  .amount-table td { border: 1px solid #ddd; }
  .amount-table .right { text-align: right; }
  .amount-table .total-row td { font-weight: bold; background: #f0f0f0; }
  .signature-block { margin-top: 12mm; display: flex; justify-content: space-between; }
  .signature-box { text-align: center; width: 45%; }
  .signature-line { border-top: 1px solid #333; margin-top: 12mm; padding-top: 2mm; }
  .footer { margin-top: 8mm; font-size: 11pt; color: #777; text-align: center; border-top: 1px solid #eee; padding-top: 3mm; }
  .highlight { background: #fffbe6; padding: 2mm 4mm; border-left: 3px solid #f0a500; margin-bottom: 4mm; }
  .note { font-size: 12pt; color: #666; margin-top: 2mm; }
</style>
</head>
<body>
